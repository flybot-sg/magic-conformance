name: MAGIC conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rct:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flybot-sg/ci-clj-clr:2.5.0
    steps:
      - uses: actions/checkout@v6
      - run: bb rct

  # Incremental: reads the committed results.edn and re-runs only changed libs.
  conformance:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flybot-sg/ci-clj-clr:2.5.0
    steps:
      - uses: actions/checkout@v6
      - run: bb check-all
